apiVersion: v1alpha1
kind: Application
metadata:
  name: tattvaai
  version: "1.0.0"
  description: "AI-Powered Incident Investigation Platform"
  locked_at: "2026-07-26T10:30:00Z"
  
spec:
  # Core Application Services - Locked State
  services:
    # Main TattvaAI Application
    - name: tattvaai-backend
      type: api-server
      framework: fastapi
      language: python
      version: "3.12"
      port: 8000
      healthcheck: "/health"
      status: 
        image: "tattvaai-backend:latest"
        container_name: "tattvaai-backend"
        networks: ["tattvaai-network"]
        environment:
          PYTHONPATH: "/app"
          LOG_LEVEL: "debug"
          SIGNOZ_API_URL: "http://signoz-query-service:8080"
          SIGNOZ_MCP_URL: "http://signoz-mcp:8000/mcp"
        volumes:
          - "./backend:/app"
        command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
          interval: "30s"
          timeout: "10s"
          retries: 3
          start_period: "40s"
      
    - name: tattvaai-frontend  
      type: web-ui
      framework: react
      language: typescript
      version: "19.0"
      port: 3001
      build_tool: vite
      status:
        image: "tattvaai-frontend:latest"
        container_name: "tattvaai-frontend"
        networks: ["tattvaai-network"]
        environment:
          VITE_API_BASE_URL: "http://localhost:8000"
          NODE_ENV: "development"
        volumes:
          - "./frontend:/app"
          - "/app/node_modules"
        command: "npm run dev -- --host 0.0.0.0 --port 5173"
        depends_on: ["tattvaai-backend"]
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
          interval: "30s"
          timeout: "10s"
          retries: 3
          start_period: "40s"
      
    # Demo Microservices (for incident simulation)
    - name: gateway-service
      type: api-gateway
      port: 8080
      language: python
      observability: true
      status:
        image: "python:3.12-slim"
        container_name: "gateway-service"
        networks: ["tattvaai-network"]
        volumes: ["./services/gateway:/app"]
        command: "python /app/main.py"
        environment:
          SERVICE_NAME: "gateway-service"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4317"
          OTEL_SERVICE_NAME: "gateway"
          
    - name: order-service
      type: microservice
      port: 8081
      language: python
      observability: true
      status:
        image: "python:3.12-slim"
        container_name: "order-service"
        networks: ["tattvaai-network"]
        volumes: ["./services/order:/app"]
        command: "python /app/main.py"
        environment:
          SERVICE_NAME: "order-service"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4317"
          OTEL_SERVICE_NAME: "order"
          
    - name: payment-service
      type: microservice  
      port: 8082
      language: python
      observability: true
      status:
        image: "python:3.12-slim"
        container_name: "payment-service"
        networks: ["tattvaai-network"]
        volumes: ["./services/payment:/app"]
        command: "python /app/main.py"
        environment:
          SERVICE_NAME: "payment-service"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4317"
          OTEL_SERVICE_NAME: "payment"
          
    - name: inventory-service
      type: microservice
      port: 8083
      language: python
      observability: true
      status:
        image: "python:3.12-slim"
        container_name: "inventory-service"
        networks: ["tattvaai-network"]
        volumes: ["./services/inventory:/app"]
        command: "python /app/main.py"
        environment:
          SERVICE_NAME: "inventory-service"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector:4317"
          OTEL_SERVICE_NAME: "inventory"

  # AI/ML Components - Runtime State
  ai_components:
    - name: trace_agent
      description: "Analyzes distributed traces for anomalies"
      status: 
        class: "TraceAgent"
        module: "app.agents.trace_agent"
        capabilities: ["trace_analysis", "anomaly_detection", "latency_analysis"]
        
    - name: logs_agent
      description: "Processes log data for error patterns"
      status:
        class: "LogsAgent" 
        module: "app.agents.logs_agent"
        capabilities: ["log_parsing", "error_detection", "pattern_matching"]
        
    - name: metrics_agent
      description: "Monitors system metrics and thresholds"
      status:
        class: "MetricsAgent"
        module: "app.agents.metrics_agent" 
        capabilities: ["metric_analysis", "threshold_monitoring", "trend_detection"]
        
    - name: dependency_agent
      description: "Maps service dependencies and failures"
      status:
        class: "DependencyAgent"
        module: "app.agents.dependency_agent"
        capabilities: ["dependency_mapping", "failure_propagation", "service_topology"]
        
    - name: alert_agent
      description: "Correlates alerts across systems"
      status:
        class: "AlertAgent"
        module: "app.agents.alert_agent"
        capabilities: ["alert_correlation", "noise_reduction", "severity_analysis"]
        
    - name: historical_agent
      description: "Matches patterns from past incidents"
      status:
        class: "HistoricalAgent"
        module: "app.agents.historical_agent"
        capabilities: ["pattern_matching", "incident_history", "similarity_analysis"]
        
    - name: coordination_engine
      description: "Orchestrates multi-agent investigation"
      status:
        class: "IncidentCoordinator"
        module: "app.coordinator.incident_coordinator"
        capabilities: ["agent_orchestration", "workflow_management", "result_synthesis"]

  # Integration & Observability - Live Configuration
  integrations:
    signoz:
      enabled: true
      status:
        url: "http://signoz-query-service:8080"
        api_endpoints: ["http://signoz-signoz-0:8080"]
        collector_endpoints: ["tcp://signoz-ingester:4317", "tcp://signoz-ingester:4318"]
        mcp_server: "http://signoz-mcp:8000/mcp"
        version: "latest"
        
    opentelemetry:
      enabled: true
      status:
        endpoint: "http://localhost:4317"
        service_name: "tattva-ai-backend"
        exporters: ["otlp"]
        processors: ["batch", "signozspanmetrics"]
        receivers: ["otlp"]
        
  # Deployment Configuration - Current State
  deployment:
    mode: aws-serverless
    environment: production
    demo_mode: true
    status:
      networks:
        - name: "tattvaai-network"
          driver: "bridge"
          created: true
          
      volumes:
        backend_data: 
          host_path: "./backend"
          container_path: "/app"
          mounted: true
        frontend_data:
          host_path: "./frontend" 
          container_path: "/app"
          mounted: true
          
      healthchecks:
        enabled: true
        interval: "30s"
        timeout: "10s"
        retries: 3
        status: "monitoring"
        
  # Application Features - Operational Status
  features:
    - name: "Multi-Agent Investigation"
      description: "AI agents analyze traces, logs, metrics, dependencies"
      status: "operational"
      agents_count: 6
      
    - name: "Root Cause Analysis"  
      description: "Automated identification of incident root causes"
      status: "operational"
      confidence_threshold: 85
      
    - name: "Evidence-Based Reasoning"
      description: "All conclusions backed by telemetry data"
      status: "operational"
      evidence_sources: ["traces", "logs", "metrics", "alerts"]
      
    - name: "Historical Pattern Matching"
      description: "Learn from past incidents for faster resolution"
      status: "operational"
      memory_retention: "90_days"
      
    - name: "Real-time Dashboard"
      description: "Live incident investigation status and results"
      status: "operational"
      endpoint: "http://localhost:3001"
      
    - name: "SigNoz Integration"
      description: "Native integration with SigNoz observability platform"
      status: "operational"
      mcp_enabled: true

  # Runtime Metrics (Lock File State)
  runtime_state:
    last_deployment: "2026-07-26T10:30:00Z"
    containers_running: 8
    services_healthy: 8
    investigation_agents: 6
    demo_services: 6
    network_operational: true
    volumes_mounted: 2
    healthchecks_passing: true