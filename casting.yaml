apiVersion: v1alpha1
kind: Application
metadata:
  name: tattvaai
  version: "1.0.0"
  description: "AI-Powered Incident Investigation Platform"
  
spec:
  # Core Application Services
  services:
    # Main TattvaAI Application
    - name: tattvaai-backend
      type: api-server
      framework: fastapi
      language: python
      version: "3.12"
      port: 8000
      healthcheck: "/health"
      
    - name: tattvaai-frontend  
      type: web-ui
      framework: react
      language: typescript
      version: "19.0"
      port: 3001
      build_tool: vite
      
    # Demo Microservices (for incident simulation)
    - name: gateway-service
      type: api-gateway
      port: 8080
      language: python
      observability: true
      
    - name: order-service
      type: microservice
      port: 8081
      language: python
      observability: true
      
    - name: payment-service
      type: microservice  
      port: 8082
      language: python
      observability: true
      
    - name: inventory-service
      type: microservice
      port: 8083
      language: python
      observability: true
      
    - name: notification-service
      type: microservice
      port: 8084
      language: python
      observability: true
      
    - name: shipping-service
      type: microservice
      port: 8085
      language: python
      observability: true

  # AI/ML Components
  ai_components:
    - trace_agent: "Analyzes distributed traces for anomalies"
    - logs_agent: "Processes log data for error patterns"  
    - metrics_agent: "Monitors system metrics and thresholds"
    - dependency_agent: "Maps service dependencies and failures"
    - alert_agent: "Correlates alerts across systems"
    - historical_agent: "Matches patterns from past incidents"
    - coordination_engine: "Orchestrates multi-agent investigation"

  # Integration & Observability
  integrations:
    signoz:
      enabled: true
      url: "${SIGNOZ_URL}"
      api_key: "${SIGNOZ_API_KEY}"
      mcp_server: "${SIGNOZ_MCP_SERVER}"
      
    opentelemetry:
      enabled: true
      endpoint: "http://localhost:4317"
      service_name: "tattva-ai-backend"
      
  # Deployment Configuration  
  deployment:
    mode: aws-serverless
    environment: production
    demo_mode: true
    
    networks:
      - tattvaai-network
      
    volumes:
      - backend_data: "./backend"
      - frontend_data: "./frontend"
      
    healthchecks:
      enabled: true
      interval: "30s"
      timeout: "10s"
      retries: 3
      
  # Application Features
  features:
    - name: "Multi-Agent Investigation"
      description: "AI agents analyze traces, logs, metrics, dependencies"
      
    - name: "Root Cause Analysis"  
      description: "Automated identification of incident root causes"
      
    - name: "Evidence-Based Reasoning"
      description: "All conclusions backed by telemetry data"
      
    - name: "Historical Pattern Matching"
      description: "Learn from past incidents for faster resolution"
      
    - name: "Real-time Dashboard"
      description: "Live incident investigation status and results"
      
    - name: "SigNoz Integration"
      description: "Native integration with SigNoz observability platform"